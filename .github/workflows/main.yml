name: Build ZTorrent .exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build .exe
        run: npm run build

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: ZTorrent-Windows
          path: dist/*.exe
